name: Build and deploy to DEV
run-name:  ${{ github.actor }} triggered deploy to DEV pipeline

on:
  push:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      env:
        description: Environment
        required: true
        default: dev-standalone
        type: choice
        options:
          - dev-standalone

jobs:
  build:
    uses: HDRUK/github-actions-templates/.github/workflows/docker-build.yaml@main
    with:
      chart_path: chart/cohort-nlp/Chart.yaml
      environment: ${{ github.event_name == 'push' && 'dev-integrated' || 'dev-standalone' }}
    secrets: inherit

  deploy-standalone:
    needs: build
    uses: HDRUK/github-actions-templates/.github/workflows/deploy-release.yml@main
    with:
      env: dev-standalone
      chart_path: chart/cohort-nlp/Chart.yaml
      git_ref: ${{ github.ref_name }}
    secrets: inherit

  deploy-integrated:
    if: github.event_name == 'push'
    needs: build
    uses: HDRUK/github-actions-templates/.github/workflows/deploy-release.yml@main
    with:
      env: dev-integrated
      chart_path: chart/cohort-nlp/Chart.yaml
      git_ref: dev
    secrets: inherit
